<!DOCTYPE html>
<html>
<head>
    <title>Electronic Appliances Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            background-color: #003366;
            color: white;
            padding: 15px;
        }

        .product {
            display: inline-block;
            width: 250px;
            margin: 15px;
            padding: 15px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 2px 2px 8px gray;
        }

        img {
            width: 200px;
            height: 150px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>

    <h1>Electronic Appliances Shop</h1>

    <div class="product">
        <img src="https://via.placeholder.com/200x150" alt="Refrigerator">
        <h3>Refrigerator</h3>
        <p>Price: ₹25,000</p>
        <button onclick="buyProduct('Refrigerator')">Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200x150" alt="Washing Machine">
        <h3>Washing Machine</h3>
        <p>Price: ₹18,000</p>
        <button onclick="buyProduct('Washing Machine')">Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200x150" alt="Television">
        <h3>Television</h3>
        <p>Price: ₹30,000</p>
        <button onclick="buyProduct('Television')">Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200x150" alt="Air Conditioner">
        <h3>Air Conditioner</h3>
        <p>Price: ₹35,000</p>
        <button onclick="buyProduct('Air Conditioner')">Buy Now</button>
    </div>

    <script>
        function buyProduct(productName) {
            alert("Thank you for choosing " + productName + "!");
        }
    </script>

</body>
</html>
